<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05080F" />
  <title>CallBridge — Işık Köprüsü Demo</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap");
    :root{
      --bg:#05080F;--surface:#0A1224;--raised:#0F1B33;--line:rgba(255,255,255,.06);
      --text:#EAF2FF;--muted:#8FA0BF;--green:#A3FF00;--cyan:#19E3D1;--danger:#FF5C7A;--warn:#FFB020;
      --spring:cubic-bezier(.2,.8,.2,1);--safe-bottom:max(16px,env(safe-area-inset-bottom));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
    body{overflow-x:hidden;background:
      radial-gradient(circle at 30% 15%,rgba(25,227,209,.08),transparent 28%),
      radial-gradient(circle at 75% 85%,rgba(163,255,0,.035),transparent 25%),var(--bg)}
    button,input,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer}button:active{transform:scale(.96)}
    button:disabled{opacity:.35;cursor:not-allowed;transform:none}
    svg{display:block}.tnum{font-variant-numeric:tabular-nums}
    .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:34px;padding:28px}
    .phone{width:412px;height:915px;max-height:calc(100vh - 36px);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);
      border-radius:40px;background:var(--bg);box-shadow:0 0 0 5px #090d16,0 0 55px rgba(25,227,209,.11)}
    .screen{height:100%;overflow:hidden;display:flex;flex-direction:column}
    .app-head{padding:22px 20px 9px;z-index:9;background:linear-gradient(180deg,var(--bg) 74%,transparent)}
    .head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
    .brand{display:flex;align-items:center;gap:9px;font:600 14px Sora,system-ui}.brand-mark{width:24px;height:24px;border-radius:8px;
      display:grid;place-items:center;background:rgba(25,227,209,.1);color:var(--cyan);border:1px solid rgba(25,227,209,.25)}
    .demo{font:700 10px Sora,system-ui;letter-spacing:.16em;color:var(--cyan);border:1px solid rgba(25,227,209,.28);padding:6px 9px;border-radius:99px;background:rgba(25,227,209,.07)}
    .bridge-line{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;font-size:10px;color:var(--muted)}
    .node{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
    .track{height:1px;position:relative;background:rgba(25,227,209,.25);overflow:visible}
    .track::after{content:"";position:absolute;width:42px;height:2px;top:-.5px;left:0;background:linear-gradient(90deg,transparent,var(--cyan),transparent);
      animation:flow 1.8s linear infinite;opacity:0}.connected .track::after,.busy .track::after{opacity:1}
    .connected .node:first-child .dot{background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 2s ease-in-out infinite}
    .offline .track{background:repeating-linear-gradient(90deg,rgba(143,160,191,.25) 0 5px,transparent 5px 10px)}
    .offline .dot{background:#53617b;box-shadow:none}.offline .track::after{display:none}
    @keyframes flow{from{transform:translateX(-35px)}to{transform:translateX(250px)}}@keyframes pulse{50%{opacity:.35;transform:scale(.65)}}
    .offline-band{margin:4px 14px 0;padding:10px 12px;border-radius:14px;background:rgba(255,92,122,.1);border:1px solid rgba(255,92,122,.18);
      color:#ffc5d0;font-size:11px;line-height:1.4;display:flex;gap:8px;align-items:center;animation:drop .25s var(--spring)}
    .view{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 18px 120px;scrollbar-width:none}.view::-webkit-scrollbar{display:none}
    .title-row{display:flex;align-items:end;justify-content:space-between;margin:7px 0 20px}.eyebrow{font-size:11px;color:var(--cyan);letter-spacing:.12em;text-transform:uppercase}
    h1,h2,h3,p{margin:0}h1{font:600 28px Sora,system-ui;letter-spacing:-.04em}h2{font:600 17px Sora,system-ui}h3{font:600 13px Sora,system-ui}
    .sub{font-size:12px;color:var(--muted);margin-top:5px}.icon-btn,.round-btn{width:48px;height:48px;border-radius:17px;background:var(--raised);color:var(--muted);display:grid;place-items:center;border:1px solid var(--line);transition:.2s var(--spring)}
    .nav{position:absolute;z-index:20;left:14px;right:14px;bottom:var(--safe-bottom);height:70px;border-radius:25px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);
      background:rgba(10,18,36,.88);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.09);box-shadow:0 0 30px rgba(0,0,0,.4)}
    .nav button{position:relative;z-index:2;background:none;color:#6f7e9c;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;transition:.25s var(--spring)}
    .nav button.active{color:var(--text)}.nav button.active::before{content:"";position:absolute;top:1px;width:22px;height:2px;border-radius:2px;background:var(--green);box-shadow:0 0 9px var(--green)}
    .nav small{font-size:9px}.badge{position:absolute;top:5px;right:12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:white;font-size:9px;display:grid;place-items:center;border:2px solid var(--surface)}
    .key-display{min-height:84px;text-align:center;margin:2px 0 10px}.number{font:500 30px Sora,system-ui;letter-spacing:.02em}.number.empty{color:#50607f}.suggest{height:24px;color:var(--cyan);font-size:12px;margin-top:8px}
    .keypad{display:grid;grid-template-columns:repeat(3,74px);justify-content:center;gap:8px 21px}.key{height:66px;background:transparent;border-radius:24px;color:var(--text);font:500 26px Sora,system-ui;transition:.18s var(--spring)}
    .key:hover{background:rgba(255,255,255,.035)}.key small{display:block;color:var(--muted);font:600 8px Inter;letter-spacing:.2em;margin-top:2px}

    .recent-strip{display:flex;gap:8px;overflow:auto;padding-bottom:3px;scrollbar-width:none}.mini-person{min-width:102px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}

    .mini-person .avatar{margin-bottom:9px}.mini-person strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-person span{font-size:9px;color:var(--muted)}
    .segments{display:flex;background:var(--surface);padding:4px;border:1px solid var(--line);border-radius:16px;overflow:auto}.segments button{min-width:max-content;flex:1;height:40px;padding:0 12px;border-radius:12px;background:transparent;color:var(--muted);font-size:11px}.segments button.active{background:var(--raised);color:var(--text)}
    .list-group{margin-top:18px}.day{font-size:10px;color:var(--muted);margin:0 3px 7px;text-transform:uppercase;letter-spacing:.1em}
    .row{min-height:65px;display:flex;align-items:center;gap:12px;padding:10px 3px;border-bottom:1px solid var(--line);animation:rise .3s both var(--spring);transition:.2s var(--spring)}
    .row:active{transform:scale(.985)}.row-main{min-width:0;flex:1}.row-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-time{font-size:9px;color:var(--muted);align-self:flex-start;margin-top:6px}.type{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(25,227,209,.09);color:var(--cyan)}
    .type.missed{background:rgba(255,92,122,.09);color:var(--danger)}.type.outgoing{color:var(--green)}
    .search{height:50px;position:sticky;top:-8px;z-index:4;display:flex;align-items:center;gap:9px;padding:0 14px;background:rgba(10,18,36,.92);backdrop-filter:blur(15px);border:1px solid var(--line);border-radius:17px}
    .search input,.composer textarea,.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text)}.search input::placeholder,.composer textarea::placeholder,.field input::placeholder{color:#687794}
    .favorites{display:flex;gap:14px;overflow:auto;padding:4px 2px 10px;scrollbar-width:none}.fav{min-width:58px;text-align:center}.fav .avatar{margin:auto}.fav span{display:block;font-size:9px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .alpha{position:absolute;right:5px;top:255px;z-index:5;display:flex;flex-direction:column;color:#63718d;font-size:7px;line-height:13px;text-align:center;width:14px}
    .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(163,255,0,.5)}
    .thread-head{display:flex;align-items:center;gap:10px;margin:1px 0 14px}.thread-head .icon-btn{width:44px;height:44px}.thread-head .avatar{width:44px;height:44px}
    .chat{display:flex;flex-direction:column;gap:8px}.date-sep{text-align:center;color:var(--muted);font-size:9px;margin:8px}
    .bubble{max-width:82%;padding:11px 13px;border-radius:18px 18px 18px 5px;background:var(--raised);font-size:12px;line-height:1.45;animation:rise .25s var(--spring)}
    .bubble.me{align-self:flex-end;border-radius:18px 18px 5px 18px;background:rgba(25,227,209,.12);border:1px solid rgba(25,227,209,.12)}
    .bubble small{display:block;text-align:right;color:var(--muted);font-size:8px;margin-top:5px}.bubble.failed{border-color:rgba(255,92,122,.4)}.retry{color:var(--danger);background:none;padding:6px 0 0;font-size:10px;min-height:28px}
    .composer{position:absolute;z-index:10;bottom:100px;left:16px;right:16px;min-height:58px;display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 14px;border-radius:21px;background:var(--raised);border:1px solid rgba(255,255,255,.09)}
    .composer textarea{resize:none;max-height:92px;min-height:39px;padding:10px 0;line-height:19px}.send{min-width:44px;width:44px;height:44px;border-radius:15px;background:var(--green);color:#071000;display:grid;place-items:center}
    .gateway-card{padding:18px;overflow:hidden;position:relative}.gateway-card::after{content:"";position:absolute;width:130px;height:130px;border:1px solid rgba(25,227,209,.12);border-radius:50%;right:-50px;top:-55px}
    .status-line{display:flex;gap:9px;align-items:center;color:var(--cyan);font-size:11px}.status-line.off{color:var(--danger)}.gateway-card h2{font-size:22px;margin:14px 0 4px}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
    .meta{padding:11px;background:rgba(5,8,15,.35);border-radius:14px}.meta span{display:block;color:var(--muted);font-size:9px}.meta strong{display:block;font-size:11px;margin-top:4px}
    .primary,.secondary,.danger-btn{min-height:48px;border-radius:15px;padding:0 16px;font-size:11px;font-weight:700;transition:.2s var(--spring)}
    .primary{background:var(--green);color:#071000}.secondary{background:rgba(25,227,209,.09);color:var(--cyan);border:1px solid rgba(25,227,209,.18)}.danger-btn{background:rgba(255,92,122,.1);color:var(--danger);border:1px solid rgba(255,92,122,.15)}
    .actions{display:flex;gap:8px}.actions>*{flex:1}.check{width:23px;height:23px;border-radius:8px;background:rgba(25,227,209,.1);display:grid;place-items:center;color:var(--cyan)}
    .log{padding:13px;margin-top:8px;font:10px/1.7 ui-monospace,SFMono-Regular,monospace;color:#91a3c2}.log div::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-right:8px}.log time{color:#5d6c88;margin-right:7px}
    .sheet-backdrop{position:absolute;inset:0;z-index:40;background:rgba(2,5,11,.72);display:flex;align-items:flex-end;animation:fade .2s}
    .sheet{width:100%;max-height:82%;overflow:auto;background:#0c172c;border:1px solid rgba(255,255,255,.1);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:sheet .28s var(--spring)}
    .handle{width:38px;height:4px;border-radius:4px;background:#35445f;margin:0 auto 19px}.sheet-profile{text-align:center}.sheet-profile .avatar{width:70px;height:70px;border-radius:24px;margin:0 auto 12px;font-size:20px}
    .sheet-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.sheet-action{background:var(--surface);border-radius:16px;min-height:65px;color:var(--muted);font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
    .field{display:block;margin:13px 0}.field span{display:block;color:var(--muted);font-size:10px;margin:0 0 6px 4px}.field input{width:100%;height:50px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:0 14px}
    .call-overlay{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 36%,rgba(25,227,209,.12),transparent 34%),#05080f;display:flex;flex-direction:column;align-items:center;padding:50px 24px calc(28px + env(safe-area-inset-bottom));animation:fade .3s}
    .call-overlay .demo{position:absolute;top:22px;right:20px}.call-bridge{position:absolute;top:68px;left:24px;right:24px}.call-avatar{width:112px;height:112px;border-radius:39px;margin-top:115px;display:grid;place-items:center;background:var(--raised);border:1px solid rgba(25,227,209,.2);font:600 30px Sora;color:var(--cyan);position:relative}
    .call-avatar::before,.call-avatar::after{content:"";position:absolute;inset:-18px;border:1px solid rgba(25,227,209,.18);border-radius:50%;animation:ring 2s ease-out infinite}.call-avatar::after{inset:-38px;animation-delay:.65s}
    .call-overlay h2{font-size:25px;margin-top:35px}.call-state{color:var(--cyan);font-size:12px;margin-top:8px}.duration{font-size:12px;color:var(--muted);margin-top:8px}
    .call-controls{margin-top:auto;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.control{background:transparent;color:var(--muted);min-height:74px;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:7px}.control i{width:52px;height:52px;border-radius:19px;background:var(--raised);display:grid;place-items:center;font-style:normal}
    .hang{grid-column:2;background:var(--danger);color:white;width:64px;height:64px;border-radius:50%;margin:auto;display:grid;place-items:center}
    .answer-zone{margin-top:auto;width:100%;height:70px;border-radius:35px;background:rgba(163,255,0,.08);border:1px solid rgba(163,255,0,.16);position:relative;overflow:hidden;touch-action:none}
    .answer-zone span{position:absolute;inset:0;display:grid;place-items:center;color:var(--green);font-size:11px;padding-left:35px}
    .answer-knob{position:absolute;left:7px;top:7px;width:54px;height:54px;border-radius:50%;background:var(--green);color:#071000;display:grid;place-items:center;z-index:2;transition:transform .15s}
    .toast{position:absolute;z-index:100;left:50%;top:94px;transform:translateX(-50%);min-width:240px;max-width:90%;padding:12px 14px;border-radius:14px;background:#13203a;border:1px solid rgba(25,227,209,.2);font-size:11px;text-align:center;animation:drop .25s var(--spring)}
    .empty{text-align:center;padding:60px 25px;color:var(--muted)}.empty svg{margin:0 auto 18px;color:#41506b}.empty h2{color:var(--text);margin-bottom:8px}.empty p{font-size:11px;line-height:1.5}
    .skeleton{padding-top:12px}.shimmer{height:64px;margin:8px 0;border-radius:18px;background:linear-gradient(90deg,var(--surface),var(--raised),var(--surface));background-size:200% 100%;animation:shimmer 1.2s infinite}
    .splash{position:absolute;z-index:200;inset:0;background:var(--bg);display:grid;place-items:center;transition:opacity .25s}.splash.out{opacity:0;pointer-events:none}.splash-core{text-align:center}.splash-logo{display:flex;align-items:center;gap:0;margin-bottom:25px}.splash-node{width:16px;height:16px;border-radius:50%;background:var(--cyan);box-shadow:0 0 20px var(--cyan);animation:nodein .65s var(--spring)}.splash-node:last-child{background:var(--green);box-shadow:0 0 20px var(--green);animation-name:nodein2}.splash-wire{width:130px;height:1px;background:linear-gradient(90deg,var(--cyan),var(--green));transform-origin:left;animation:wire .7s .25s both var(--spring)}.splash h1{font-size:21px}.splash p{font-size:10px;color:var(--muted);margin-top:8px}
    .panel{width:310px;max-height:780px;background:rgba(10,18,36,.88);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:22px;backdrop-filter:blur(20px)}
    .panel-top{display:flex;justify-content:space-between;align-items:start}.panel h2{font-size:17px}.panel p{font-size:10px;color:var(--muted);line-height:1.5;margin:7px 0 18px}.panel button{width:100%;min-height:49px;margin:5px 0;border-radius:15px;background:var(--raised);color:var(--text);border:1px solid var(--line);text-align:left;padding:0 14px;font-size:11px;display:flex;align-items:center;gap:10px}.panel button:hover{border-color:rgba(25,227,209,.2)}.panel .danger-btn{color:var(--danger)}
    .panel-toggle{display:none}.close-panel{display:none}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}}@keyframes drop{from{opacity:0;transform:translate(-50%,-8px)}}@keyframes sheet{from{transform:translateY(100%)}}@keyframes ring{0%{opacity:.5;transform:scale(.86)}100%{opacity:0;transform:scale(1.16)}}@keyframes shimmer{to{background-position:-200% 0}}@keyframes nodein{from{transform:translateX(-75px);opacity:0}}@keyframes nodein2{from{transform:translateX(75px);opacity:0}}@keyframes wire{from{transform:scaleX(0)}}
    @media(max-width:820px){body{background:var(--bg)}.stage{padding:0;display:block}.phone{width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}.panel{display:none;position:fixed;z-index:300;left:10px;right:10px;bottom:10px;width:auto;max-height:82vh;overflow:auto;border-radius:28px}.panel.open{display:block;animation:sheet .28s var(--spring)}.panel-toggle{display:grid;position:absolute;z-index:30;right:15px;bottom:94px;width:48px;height:48px;border-radius:17px;background:var(--raised);color:var(--cyan);place-items:center;border:1px solid rgba(25,227,209,.2)}.close-panel{display:grid!important;width:38px!important;min-height:38px!important;height:38px;margin:0!important;padding:0!important;place-items:center;text-align:center!important}}

</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="CallBridge telefon demosu">
      <div id="app" class="screen"></div>
      <button class="panel-toggle" id="panelToggle" aria-label="Demo kontrol panelini aç"></button>
      <div class="splash" id="splash"><div class="splash-core"><div class="splash-logo"><i class="splash-node"></i><i class="splash-wire"></i><i class="splash-node"></i></div><h1>CallBridge</h1><p>Işık Köprüsü kuruluyor</p></div></div>
    </section>
    <aside class="panel" id="panel">
      <div class="panel-top"><div><span class="eyebrow">Simülasyon</span><h2>Demo Kontrol Paneli</h2></div><button class="close-panel" id="panelClose" aria-label="Paneli kapat">×</button></div>
      <p>Gateway olaylarını tetikleyin ve Client arayüzünün gerçek zamanlı tepkisini izleyin.</p>
      <button data-control="incomingCall"></button>
      <button data-control="incomingSms"></button>
      <button data-control="connection"></button>
      <button data-control="failSms"></button>
      <button data-control="missed"></button>
      <button data-control="reset" class="danger-btn"></button>
    </aside>
  </main>
  <script>
  (() => {
    const $ = (s, p=document) => p.querySelector(s);
    const $$ = (s, p=document) => [...p.querySelectorAll(s)];
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const safeStore = {
      get(k, fallback){ try { const v=localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
      set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
      clear(){ try { ["cb-favorites","cb-read","cb-contacts"].forEach(k=>localStorage.removeItem(k)); } catch {} }
    };
    const names=["Ayşe Demir","Mehmet Kaya","Elif Yıldız","Can Aydın","Zeynep Arslan","Burak Şahin","Deniz Koç","Selin Öztürk","Annem","Ofis","Mert Akın","Derya Güneş","Kerem Çelik","Nazlı Kurt"];
    const baseContacts=names.map((name,i)=>({id:i+1,name,phone:`0500 000 00 ${String(i+1).padStart(2,"0")}`}));
    const now=Date.now();
    const callTypes=["incoming","outgoing","missed","incoming","outgoing"];
    const baseCalls=Array.from({length:25},(_,i)=>({id:"c"+i,contactId:(i%14)+1,type:callTypes[i%5],time:now-(i*6.2*60*60*1000),duration:i%5===2?0:42+i*7}));
    const baseThreads=[

      $$("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});
      $$("[data-call-detail]").forEach(b=>b.onclick=()=>{const c=state.calls.find(x=>x.id===b.dataset.callDetail);state.sheet={kind:"call",...c};render()});
      $$("[data-contact]").forEach(b=>b.onclick=()=>{state.sheet={kind:"contact",id:+b.dataset.contact};render()});
      $("#contactSearch")?.addEventListener("input",e=>{state.query=e.target.value;render();requestAnimationFrame(()=>{const i=$("#contactSearch");i?.focus();i?.setSelectionRange(i.value.length,i.value.length)})});
      $("[data-new]")?.addEventListener("click",()=>{state.form="new";render()});
      $$("[data-thread]").forEach(b=>b.onclick=()=>{state.thread=+b.dataset.thread;if(!state.read.includes(state.thread)){state.read.push(state.thread);safeStore.set("cb-read",state.read)}render()});
      $("[data-back]")?.addEventListener("click",()=>{state.thread=null;render()});
      $("[data-send]")?.addEventListener("click",async()=>{const i=$("#messageInput"),text=i.value.trim();if(text)await bridge.sendSms(state.threads.find(x=>x.id===state.thread).contactId,text)});
      $("#messageInput")?.addEventListener("input",e=>{e.target.style.height="39px";e.target.style.height=Math.min(e.target.scrollHeight,92)+"px"});
      $$("[data-retry]").forEach(b=>b.onclick=async()=>{const th=state.threads.find(x=>x.id===state.thread),m=th.messages[+b.dataset.retry];m[1]="sending";render();await sleep(700);m[1]="out";addLog("SMS yeniden gönderildi");render()});
      $("[data-sync]")?.addEventListener("click",()=>bridge.syncNow());
      $("[data-reconnect]")?.addEventListener("click",()=>{if(!state.connected)toggleConnection()});
      $("[data-dismiss]")?.addEventListener("click",()=>{state.sheet=null;state.form=null;render()});
      $$("[data-message]").forEach(b=>b.onclick=()=>{const id=+b.dataset.message;let th=state.threads.find(x=>x.contactId===id);if(!th){th={id:Date.now(),contactId:id,unread:0,messages:[]};state.threads.unshift(th)}state.sheet=null;state.tab="messages";state.thread=th.id;render()});
      $$("[data-favorite]").forEach(b=>b.onclick=()=>{const id=+b.dataset.favorite;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];safeStore.set("cb-favorites",state.favorites);state.sheet=null;notify(state.favorites.includes(id)?"Favorilere eklendi":"Favorilerden çıkarıldı")});
      $$("[data-edit]").forEach(b=>b.onclick=()=>{state.form=+b.dataset.edit;state.sheet=null;render()});
      $("[data-save-contact]")?.addEventListener("click",async()=>{const name=$("#formName").value.trim(),phone=$("#formPhone").value.trim();if(!name||!phone)return notify("Ad ve telefon alanları gerekli");await bridge.saveContact({id:state.form==="new"?null:state.form,name,phone});state.form=null;notify("Kişi kaydedildi")});
      $$("[data-hang]").forEach(b=>b.onclick=()=>bridge.hangUp());
      setupAnswer();
    }
    function setupAnswer(){
      const zone=$("#answerZone"),knob=$("#answerKnob");if(!zone)return;let start=0,drag=false;
      knob.onpointerdown=e=>{drag=true;start=e.clientX;knob.setPointerCapture(e.pointerId)};
      knob.onpointermove=e=>{if(!drag)return;const x=Math.max(0,Math.min(e.clientX-start,zone.clientWidth-68));knob.style.transform=`translateX(${x}px)`};
      knob.onpointerup=e=>{drag=false;const x=e.clientX-start;if(x>zone.clientWidth*.48)bridge.answerCall();else knob.style.transform="translateX(0)"};
    }
    $("#panelToggle").onclick=()=>$("#panel").classList.add("open");
    $("#panelClose").onclick=()=>$("#panel").classList.remove("open");
    $$("[data-control]").forEach(b=>b.onclick=()=>{
      const a=b.dataset.control;$("#panel").classList.remove("open");
      if(a==="incomingCall")startIncoming();
      if(a==="incomingSms"){const th=state.threads[1];th.messages.push(["Müsait olduğunda beni arar mısın?","in","şimdi"]);th.unread=1;state.read=state.read.filter(x=>x!==th.id);safeStore.set("cb-read",state.read);addLog("Gateway yeni SMS iletti");notify("Annem'den yeni mesaj")}
      if(a==="connection")toggleConnection();
      if(a==="failSms"){state.failNext=true;notify("Sonraki SMS gönderimi başarısız olacak")}
      if(a==="missed")addMissed();
      if(a==="reset"){safeStore.clear();location.reload()}
    });
    setInterval(()=>{if(state.call?.start){const el=$("#duration");if(el)el.textContent=formatDur(Math.floor((Date.now()-state.call.start)/1000))}},1000);
    render();
    setTimeout(()=>$("#splash").classList.add("out"),1050);
  })();
  </script>
</body>
</html>
